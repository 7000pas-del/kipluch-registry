<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТОО КИП Луч — Реестр взвешиваний</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    /* Форма авторизации */
    .login-card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-card h2 {
      margin-top: 0;
      margin-bottom: 5px;
      color: #2c3e50;
    }
    .login-card p {
      color: #7f8c8d;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #34495e;
      font-weight: 600;
    }
    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #0056b3;
    }
    .error-msg {
      color: #dc3545;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }

    /* Основной контент реестра */
    #main-content {
      display: none;
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .btn-logout {
      padding: 8px 16px;
      background: #dc3545;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-logout:hover {
      background: #c82333;
    }
  </style>
</head>
<body>

  <!-- Окно авторизации -->
  <div id="login-block" class="login-card">
    <h2>ТОО «КИП Луч»</h2>
    <p>Вход в систему учета веса</p>
    
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Логин</label>
        <input type="text" id="username" required placeholder="Введите логин">
      </div>
      <div class="input-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" required placeholder="Введите пароль">
      </div>
      <button type="submit" class="btn-login">Войти</button>
      <div id="error-message" class="error-msg">Неверный логин или пароль</div>
    </form>
  </div>

  <!-- Панель реестра (видна после успешного входа) -->
  <div id="main-content">
    <div class="header-bar">
      <h1 style="margin: 0; font-size: 22px; color: #2c3e50;">Реестр взвешиваний ТОО «КИП Луч»</h1>
      <button onclick="logout()" class="btn-logout">Выйти</button>
    </div>
    
    <!-- Сюда помещается ваш основной интерфейс реестра -->
    <p style="color: #28a745; font-weight: 600;">✓ Вы успешно вошли в систему!</p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBlock = document.getElementById('login-block');
    const mainContent = document.getElementById('main-content');
    const errorMsg = document.getElementById('error-message');

    // Проверка сохраненного входа
    if (localStorage.getItem('isLoggedIn') === 'true') {
      showRegistry();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('isLoggedIn', 'true');
          showRegistry();
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        alert('Ошибка соединения с сервером');
      }
    });

    function showRegistry() {
      loginBlock.style.display = 'none';
      mainContent.style.display = 'block';
    }

    function logout() {
      localStorage.removeItem('isLoggedIn');
      location.reload();
    }
  </script>
</body>
</html>
