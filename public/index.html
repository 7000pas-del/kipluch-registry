<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реестр оборудования и архив</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Оверлей авторизации -->
    <div id="authOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: #1e293b; border: 1px solid var(--border); padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <h2 style="color: #fff; margin-bottom: 20px; text-align: center; font-size: 20px;">🔐 Вход в систему</h2>
            <form id="authForm">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Логин:</label>
                    <input type="text" id="authLogin" required style="width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Пароль:</label>
                    <input type="password" id="authPassword" required style="width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box;">
                </div>
                <div id="authError" style="color: #ef4444; font-size: 12px; margin-bottom: 12px; display: none;"></div>
                <button type="submit" class="btn" style="width: 100%; background: #0284c7; padding: 10px; font-weight: 600;">Войти</button>
            </form>
        </div>
    </div>

    <!-- Основной контейнер приложения -->
    <div class="app-container">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Реестр</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-card active" id="navDoc" onclick="selectTab('doc')">
                    <span>📄 Документы</span>
                    <span class="badge" id="countDoc">0</span>
                </a>
                <a href="#" class="nav-card" id="navImage" onclick="selectTab('image')">
                    <span>🖼️ Фотографии</span>
                    <span class="badge" id="countImage">0</span>
                </a>
                <a href="#" class="nav-card" id="navNote" onclick="selectTab('note')">
                    <span>📝 Заметки</span>
                    <span class="badge" id="countNote">0</span>
                </a>
                <a href="#" class="nav-card" id="navAdmin" onclick="selectTab('admin')" style="display: none;">
                    <span>⚙️ Админ</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div id="currentUserBadge" style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;"></div>
                <button class="btn" onclick="logoutSystem()" style="width: 100%; background: #334155; font-size: 12px;">Выйти</button>
            </div>
        </aside>

        <!-- Главная рабочая область -->
        <main class="main-content">
            <header class="top-header">
                <h1 id="sectionTitle">📄 Документы</h1>
                <div class="header-actions">
                    <button class="btn" id="btnCreateFolder" onclick="promptCreateFolder()">📁 Создать папку</button>
                    <button class="btn" id="btnUploadDoc" onclick="document.getElementById('fileInput').click()" style="display: none; background: #0284c7;">➕ Загрузить документ</button>
                    <button class="btn" id="btnUploadPhoto" onclick="document.getElementById('fileInput').click()" style="display: none; background: #0284c7;">➕ Загрузить фото</button>
                    <input type="file" id="fileInput" style="display: none;" multiple onchange="uploadFiles(this.files)">
                </div>
            </header>

            <!-- Секция документов / архива -->
            <div id="contentSection" class="content-section" style="display: flex; flex-direction: column; gap: 12px;">
                <div id="folderBanner" style="display: none; align-items: center; gap: 8px; background: #1e293b; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);">
                    <button class="btn" onclick="exitFolder()" style="padding: 4px 8px; font-size: 11px; background: #334155;">⬅ Назад</button>
                    <span id="currentFolderPath" style="font-size: 13px; color: #38bdf8;">Папка</span>
                </div>
                <div id="foldersContainer"></div>
                <div id="filesContainer"></div>
            </div>

            <!-- Секция администратора -->
            <div id="adminSection" class="content-section" style="display: none; flex-direction: column; gap: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="color: #fff; font-size: 16px;">Управление пользователями</h3>
                    <button class="btn" onclick="openUserModal()" style="background: #0284c7;">➕ Добавить пользователя</button>
                </div>
                <div style="background: #1e293b; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border); color: var(--text-muted); background: #0f172a;">
                                <th style="padding: 10px;">Логин</th>
                                <th style="padding: 10px;">Роль</th>
                                <th style="padding: 10px;">Права</th>
                                <th style="padding: 10px; text-align: right;">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Экран приветствия / Реестр оборудования -->
            <div id="welcomeScreen" style="display: block;">
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #fff; margin-bottom: 10px;">⚖️ Реестр весового оборудования</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                        <input type="text" class="real-search-input" placeholder="Поиск по наименованию, зав. номеру, объекту..." style="flex-grow: 1; padding: 8px 12px; background: #1e293b; border: 1px solid var(--border); color: #fff; border-radius: 6px;">
                        <button class="btn" onclick="openEquipmentModal()" style="background: #0284c7;">➕ Добавить весы</button>
                    </div>
                </div>
                <div style="background: #1e293b; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border); color: var(--text-muted); background: #0f172a;">
                                <th style="padding: 10px;">Наименование</th>
                                <th style="padding: 10px;">Зав. №</th>
                                <th style="padding: 10px;">Владелец</th>
                                <th style="padding: 10px;">Объект / Место</th>
                                <th style="padding: 10px;">След. поверка</th>
                                <th style="padding: 10px;">Статус</th>
                                <th style="padding: 10px; text-align: right;">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="equipmentTableBody"></tbody>
                    </table>
                </div>
                <div id="mobileEquipmentList" style="display: none; flex-direction: column; gap: 8px; margin-top: 10px;"></div>
            </div>
        </main>
    </div>

    <!-- Модальное окно пользователя (с исправленным выравниванием и view_only) -->
    <div id="userModal" class="modal-backdrop" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: #1e293b; border: 1px solid var(--border); padding: 24px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <h3 id="userModalTitle" style="color: #fff; margin-bottom: 16px; font-size: 18px;">👤 Пользователь</h3>
            
            <form onsubmit="saveUser(event)">
                <input type="hidden" id="userIdInput">
                
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Логин:*</label>
                    <input type="text" id="userLoginInput" required style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 12px;">
                    <label id="userPasswordLabel" style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Пароль:*</label>
                    <input type="password" id="userPasswordInput" placeholder="••••••••" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Роль:</label>
                    <select id="userRoleInput" onchange="onRoleChangeSelect()" style="width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box;">
                        <option value="user">Пользователь</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>

                <div id="permissionsGroup" style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600;">Права доступа:</label>
                    
                    <div style="display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid var(--border);">
                        <label style="display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; cursor: pointer;">
                            <input type="checkbox" class="perm-checkbox" value="view_only" style="width: 16px; height: 16px; accent-color: #38bdf8;">
                            👁️ Просмотр сайта (без прав редактирования и удаления)
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; cursor: pointer;">
                            <input type="checkbox" class="perm-checkbox" value="equipment" style="width: 16px; height: 16px; accent-color: #38bdf8;">
                            ⚖️ Реестр оборудования (Весы)
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; cursor: pointer;">
                            <input type="checkbox" class="perm-checkbox" value="doc" style="width: 16px; height: 16px; accent-color: #38bdf8;">
                            📄 Документы
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; cursor: pointer;">
                            <input type="checkbox" class="perm-checkbox" value="image" style="width: 16px; height: 16px; accent-color: #38bdf8;">
                            🖼️ Фотографии
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; cursor: pointer;">
                            <input type="checkbox" class="perm-checkbox" value="note" style="width: 16px; height: 16px; accent-color: #38bdf8;">
                            📝 Заметки
                        </label>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" class="btn" onclick="closeUserModal()" style="background: #334155; padding: 8px 16px;">Отмена</button>
                    <button type="submit" class="btn" style="background: #0284c7; padding: 8px 16px;">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Остальные модальные окна -->
    <div id="equipmentModal" class="modal-backdrop" style="display:none;"></div>
    <div id="viewEquipmentModal" class="modal-backdrop" style="display:none;"></div>
    <div id="maintenanceModal" class="modal-backdrop" style="display:none;"></div>
    <div id="noteModal" class="modal-backdrop" style="display:none;"></div>
    <div id="viewNoteModal" class="modal-backdrop" style="display:none;"></div>
    <div id="backupModal" class="modal-backdrop" style="display:none;"></div>

    <script src="/js/script.js"></script>
</body>
</html>
